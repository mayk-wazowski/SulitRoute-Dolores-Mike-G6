{% extends "base.html" %}

{% block title %}Register - SulitRoute{% endblock %}

{% block content %}
<div class="card">
    <h2>Create an account</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Register</button>
    </form>
    <p>Already have an account? <a href="{% url 'accounts:login' %}">Login here</a></p>
</div>
{% endblock %}
