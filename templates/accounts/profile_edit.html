{% extends "base.html" %}

{% block title %}Edit Profile - SulitRoute{% endblock %}

{% block content %}
<div class="card">
    <h2>Edit Profile</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ user_form.as_p }}
        {{ profile_form.as_p }}
        <button type="submit" class="btn">Save changes</button>
        <a href="{% url 'accounts:profile' %}">Cancel</a>
    </form>
</div>
{% endblock %}
